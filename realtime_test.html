<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBIE | Real-Time Bias Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .risk-low { border-color: #22c55e; box-shadow: 0 0 10px rgba(34, 197, 94, 0.2); }
        .risk-medium { border-color: #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.2); }
        .risk-high { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-8 font-sans">
    
    <div class="max-w-4xl mx-auto">
        <div class="flex items-center gap-3 mb-8">
            <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse" id="status-dot"></div>
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
                Cognitive Intelligence Engine (Live)
            </h1>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Input Area -->
            <div>
                <label class="block text-gray-400 text-sm mb-2 uppercase tracking-wide">Type your thoughts/arguments:</label>
                <textarea 
                    id="thought-input" 
                    class="w-full h-64 p-4 bg-gray-800 border-2 border-gray-700 rounded-xl focus:outline-none transition-all duration-300 text-gray-200 resize-none"
                    placeholder="Start typing... e.g., 'Everyone knows that this is a complete disaster...'"
                ></textarea>
                <p class="text-xs text-gray-500 mt-2">Data is streamed to the FastAPI WebSockets backend instantly.</p>
            </div>

            <!-- Analysis Dashboard -->
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 h-64 overflow-y-auto" id="dashboard">
                <div class="text-center text-gray-500 mt-16" id="waiting-state">
                    <svg class="w-12 h-12 mx-auto mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                    Awaiting keystrokes...
                </div>

                <div id="results-state" class="hidden space-y-4">
                    <!-- Sentiment Bar -->
                    <div>
                        <div class="flex justify-between text-xs text-gray-400 mb-1">
                            <span>Sentiment</span>
                            <span id="sentiment-score">0.0</span>
                        </div>
                        <div class="h-2 w-full bg-gray-700 rounded-full overflow-hidden flex">
                            <div id="bar-neg" class="bg-red-500 h-full w-0 transition-all duration-300"></div>
                            <div id="bar-neu" class="bg-gray-500 h-full w-0 transition-all duration-300"></div>
                            <div id="bar-pos" class="bg-green-500 h-full w-0 transition-all duration-300"></div>
                        </div>
                    </div>

                    <!-- Biases Detected -->
                    <div>
                        <h3 class="text-xs text-gray-400 uppercase tracking-wide mb-2">Detected Biases</h3>
                        <div id="bias-tags" class="flex flex-wrap gap-2"></div>
                    </div>

                    <!-- Suggestions -->
                    <div>
                        <h3 class="text-xs text-gray-400 uppercase tracking-wide mb-2">AI Neutral Rewrites</h3>
                        <div id="suggestions-box" class="space-y-2 text-sm text-blue-300"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('thought-input');
        const statusDot = document.getElementById('status-dot');
        const waitingState = document.getElementById('waiting-state');
        const resultsState = document.getElementById('results-state');
        
        // Connect to FastAPI WebSockets
        const ws = new WebSocket('ws://localhost:8000/ws/realtime');

        ws.onopen = () => {
            console.log('Connected to CBIE Real-Time Engine');
            statusDot.classList.replace('bg-red-500', 'bg-green-500');
            statusDot.classList.add('animate-pulse');
        };

        ws.onclose = () => {
            statusDot.classList.replace('bg-green-500', 'bg-red-500');
            statusDot.classList.remove('animate-pulse');
        };

        // Send keystrokes as they happen
        input.addEventListener('input', (e) => {
            const text = e.target.value;
            if (text.length > 5 && ws.readyState === WebSocket.OPEN) {
                ws.send(text);
                waitingState.classList.add('hidden');
                resultsState.classList.remove('hidden');
            } else if (text.length === 0) {
                waitingState.classList.remove('hidden');
                resultsState.classList.add('hidden');
                input.className = "w-full h-64 p-4 bg-gray-800 border-2 border-gray-700 rounded-xl focus:outline-none transition-all duration-300 text-gray-200 resize-none";
            }
        });

        // Receive instantaneous AI analysis
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            console.log(data);

            // Update border color based on risk
            input.className = `w-full h-64 p-4 bg-gray-800 border-2 rounded-xl focus:outline-none transition-all duration-300 text-gray-200 resize-none risk-${data.risk_level}`;

            // Update Sentiment Bars
            document.getElementById('sentiment-score').innerText = `Compound: ${data.sentiment.compound}`;
            document.getElementById('bar-neg').style.width = `${data.sentiment.negativeScore * 100}%`;
            document.getElementById('bar-neu').style.width = `${data.sentiment.neutralScore * 100}%`;
            document.getElementById('bar-pos').style.width = `${data.sentiment.positiveScore * 100}%`;

            // Update Bias Tags
            const biasContainer = document.getElementById('bias-tags');
            biasContainer.innerHTML = '';
            if (data.detected_biases.length === 0) {
                biasContainer.innerHTML = '<span class="text-xs text-gray-500 italic">No cognitive bias detected. Rational thinking active.</span>';
            } else {
                data.detected_biases.forEach(bias => {
                    const el = document.createElement('span');
                    el.className = 'px-2 py-1 bg-red-900/50 text-red-300 border border-red-800 rounded text-xs font-semibold';
                    el.innerText = `${bias.type} (${(bias.confidence * 100).toFixed(0)}%)`;
                    biasContainer.appendChild(el);
                });
            }

            // Update Suggestions
            const suggContainer = document.getElementById('suggestions-box');
            suggContainer.innerHTML = '';
            data.suggestions.forEach(sugg => {
                const el = document.createElement('div');
                el.className = 'p-2 bg-blue-900/30 rounded border-l-4 border-blue-500';
                el.innerText = sugg;
                suggContainer.appendChild(el);
            });
        };
    </script>
</body>
</html>
